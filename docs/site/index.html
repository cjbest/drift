<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7f0">
  <meta name="description" content="The note-taking app I always wanted for myself. Drift for Mac and iPhone.">
  <title>Drift — a place for your notes</title>
  <link rel="canonical" href="https://cjbest.github.io/drift/">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preload" href="assets/Newsreader-Italic.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: Newsreader;
      src: url("assets/Newsreader-Italic.ttf") format("truetype");
      font-style: italic;
      font-weight: 200 800;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      --paper: #faf7f0;
      --ink: #302b25;
      --muted: #776d60;
      --line: #dcd4c8;
      --media-height: clamp(220px, calc(100svh - 420px), 400px);
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(24px, 4svh, 48px) 32px 24px; }
    main { max-width: 1080px; margin: 0 auto; }
    header { text-align: center; }
    h1 {
      margin: 0 0 14px;
      font: italic 400 clamp(48px, 7.5svh, 68px)/1 Newsreader, Georgia, serif;
    }
    .intro { max-width: 760px; margin: 0 auto; font-size: 19px; line-height: 1.5; text-wrap: pretty; }
    .intro span { display: block; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .2em; }
    a:hover { text-decoration-color: var(--muted); }
    a:focus-visible, button:focus-visible { outline: 2px solid #926b38; outline-offset: 5px; }
    .apps { display: grid; grid-template-columns: 1.4fr 1fr; grid-template-areas: "mac iphone"; gap: 40px; margin-top: 32px; }
    .app { min-width: 0; text-align: center; }
    .mac { grid-area: mac; }
    .iphone { grid-area: iphone; }
    .stage { height: var(--media-height); display: flex; align-items: center; justify-content: center; }
    .stage img { display: block; width: auto; height: 100%; max-width: 100%; object-fit: contain; }
    .desktop-window { width: min(100%, calc(var(--media-height) * 1596 / 1154)); filter: drop-shadow(0 8px 14px #302b2514); }
    .desktop-window img { width: 100%; height: auto; clip-path: inset(1.56% 1.13% 1.39% 1.13% round 2.1%); }
    .download { display: inline-flex; align-items: center; justify-content: center; gap: 9px; margin-top: 23px; min-height: 44px; padding: 9px 17px; border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--ink); font: inherit; font-size: 16px; line-height: 24px; text-decoration: none; }
    .download:disabled { opacity: 1; cursor: default; -webkit-text-fill-color: var(--ink); }
    a.download { border-color: var(--ink); background: var(--ink); color: var(--paper); }
    a.download:hover { background: #4b4135; }
    .download svg { width: 16px; height: 16px; }
    .availability { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 20px; }
    footer { margin-top: 30px; text-align: center; color: var(--muted); font-size: 14px; line-height: 22px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 700px) {
      body { padding: 28px 22px; }
      h1 { font-size: 52px; margin-bottom: 16px; }
      .intro { max-width: 440px; font-size: 17px; line-height: 1.55; }
      .intro span + span { margin-top: 8px; }
      .apps { display: flex; flex-direction: column; gap: 44px; margin-top: 30px; }
      .stage { height: auto; }
      .iphone .stage img { height: auto; width: min(100%, 360px); }
      .desktop-window { width: min(100%, 520px); }
      .download { margin-top: 20px; }
      footer { margin-top: 40px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Drift</h1>
      <p class="intro">
        <span>Hi, I’m <a href="https://substack.com/@cb">Chris</a>, and I obsessively made the perfect note-taking app for myself.</span>
        <span>If you would like to try it too, here it is.</span>
      </p>
    </header>

    <div class="apps">
      <section class="app iphone" aria-labelledby="iphone-title">
        <h2 class="sr-only" id="iphone-title">Drift for iPhone</h2>
        <div class="stage">
          <img src="assets/iphone.png" width="1600" height="1583" alt="Drift on iPhone: a full notebook in light mode, and an open note in dark mode." fetchpriority="high">
        </div>
        <!-- Replace this disabled button with the verified TestFlight or App Store link when available. -->
        <button class="download" type="button" disabled aria-describedby="iphone-availability">Download Drift for iPhone
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3v11m-4-4 4 4 4-4M4 17h12"/></svg>
        </button>
        <p class="availability" id="iphone-availability">Coming soon</p>
      </section>

      <section class="app mac" aria-labelledby="mac-title">
        <h2 class="sr-only" id="mac-title">Drift for Mac</h2>
        <div class="stage">
          <div class="desktop-window">
            <img src="assets/desktop.png" width="1596" height="1154" alt="A light Drift window on Mac, with a checklist: a delightful place for your notes, checklists, fast search, keyboard driven, dark mode, and nothing you don’t want.">
          </div>
        </div>
        <!-- Replace this disabled button with the verified notarized DMG link when available. -->
        <button class="download" type="button" disabled aria-describedby="mac-availability">Download Drift for Mac
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3v11m-4-4 4 4 4-4M4 17h12"/></svg>
        </button>
        <p class="availability" id="mac-availability">Coming soon · Apple silicon</p>
      </section>
    </div>

    <footer><a href="https://github.com/cjbest/drift">Source code here</a></footer>
  </main>
</body>
</html>
