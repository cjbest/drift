<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Drift Editor</title>
<style>
/* === Base === */
* { box-sizing: border-box; }

:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --selection: #EEFF41;
}

:root[data-theme="dark"] {
  --bg: #1a1a1a;
  --fg: #e0e0e0;
}

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* === Heading markers - muted # symbols === */
.heading-marker { color: rgba(0, 0, 0, 0.3); }
:root[data-theme="dark"] .heading-marker { color: rgba(255, 255, 255, 0.3); }

.heading { font-weight: 600; }

/* === Blockquote === */
.blockquote-marker { color: rgba(0, 0, 0, 0.3); }
:root[data-theme="dark"] .blockquote-marker { color: rgba(255, 255, 255, 0.3); }
.blockquote-text { font-style: italic; }

/* === Emphasis === */
.bold-text { font-weight: 600; }
.italic-text { font-style: italic; }

/* === Links === */
.link-bracket { color: rgba(0, 0, 0, 0.3); }
:root[data-theme="dark"] .link-bracket { color: rgba(255, 255, 255, 0.3); }
.link-text { text-decoration: underline; }
.link-url { color: rgba(0, 0, 0, 0.25); }
:root[data-theme="dark"] .link-url { color: rgba(255, 255, 255, 0.25); }
.link-url-truncated { color: rgba(0, 0, 0, 0.25); }
:root[data-theme="dark"] .link-url-truncated { color: rgba(255, 255, 255, 0.25); }
.bare-url { text-decoration: underline; }

/* === Checkboxes === */
.checkbox-marker {
  cursor: pointer;
  border-radius: 2px;
  transition: background-color 0.1s ease;
}
.checkbox-marker:active { background-color: rgba(0, 0, 0, 0.1); }
:root[data-theme="dark"] .checkbox-marker:active { background-color: rgba(255, 255, 255, 0.15); }

/* === First line title === */
.first-line-title {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  font-weight: 600;
  font-size: 1.618em;
  line-height: 1.4;
}

/* === Selection === */
.cm-selectionLayer { display: none !important; }
.cm-content ::selection { background: transparent !important; }
.selection-highlight {
  background-color: #EEFF41;
  color: #000000;
  border-radius: 3px;
  padding: 1px 0;
}

/* === Cursor === */
.cm-content { caret-color: transparent !important; }
.cm-cursor, .cm-cursor-primary {
  border-left: 2px solid #000000 !important;
  height: 1.61em !important;
  transform: translate(-1px, -0.25em);
  animation: none !important;
}
.cursor-in-title .cm-cursor,
.cursor-in-title .cm-cursor-primary {
  height: 2.6em !important;
  transform: translate(-1px, -0.55em);
}
:root[data-theme="dark"] .cm-cursor,
:root[data-theme="dark"] .cm-cursor-primary {
  border-left-width: 1.5px !important;
  border-left-color: #ffffff !important;
}

/* === AI loading shimmer === */
.ai-loading .selection-highlight {
  background: linear-gradient(90deg, #EEFF41 0%, #EEFF41 35%, #ffffff 50%, #EEFF41 65%, #EEFF41 100%);
  background-size: 300% 100%;
  animation: ai-shimmer 1s linear infinite;
}
@keyframes ai-shimmer {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

/* === Search panel === */
.cm-panels-top {
  position: absolute !important;
  top: 0 !important;
  right: 0 !important;
  left: auto !important;
  width: auto !important;
  background: transparent !important;
  border: none !important;
  z-index: 50;
  padding: 8px 16px 0 0 !important;
}

.cm-panel.cm-search {
  background: var(--bg);
  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 8px;
  padding: 6px 8px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
}
:root[data-theme="dark"] .cm-panel.cm-search {
  border-color: rgba(255, 255, 255, 0.12);
  box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
}

/* Hide replace row and extras */
.cm-panel.cm-search br,
.cm-panel.cm-search br + input,
.cm-panel.cm-search br + input + button,
.cm-panel.cm-search br + input + button + button,
.cm-panel.cm-search [name="select"],
.cm-panel.cm-search [name="close"],
.cm-panel.cm-search label { display: none !important; }

.cm-panel.cm-search .search-input-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}
.cm-panel.cm-search input[main-field] {
  font-family: "SF Mono", Menlo, Monaco, monospace;
  font-size: 13px;
  border-radius: 6px;
  border: 1px solid rgba(0, 0, 0, 0.1);
  background: rgba(0, 0, 0, 0.03);
  color: var(--fg);
  padding: 7px 50px 7px 10px;
  width: 200px;
  box-sizing: border-box;
}
.cm-panel.cm-search input[main-field]:focus { outline: none; border-color: rgba(0, 0, 0, 0.2); }
:root[data-theme="dark"] .cm-panel.cm-search input[main-field] {
  background: rgba(255, 255, 255, 0.06);
  border-color: rgba(255, 255, 255, 0.1);
}

.cm-panel.cm-search .search-match-count {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--fg);
  opacity: 0.4;
  pointer-events: none;
}

.cm-panel.cm-search button[name="next"],
.cm-panel.cm-search button[name="prev"] {
  font-size: 0;
  width: 26px; height: 26px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0.5; padding: 0;
}
.cm-panel.cm-search button[name="prev"] { order: 1; }
.cm-panel.cm-search button[name="next"] { order: 2; }
.cm-panel.cm-search .search-done-btn { order: 3; }
.cm-panel.cm-search button[name="prev"]::after { content: "\2039"; font-size: 18px; font-weight: 300; }
.cm-panel.cm-search button[name="next"]::after { content: "\203A"; font-size: 18px; font-weight: 300; }

.cm-panel.cm-search .search-done-btn {
  font-family: inherit; font-size: 13px; font-weight: 500;
  border-radius: 4px; border: none; background: transparent;
  color: var(--fg); opacity: 0.6; cursor: pointer; padding: 4px 8px; margin-left: 2px;
}

.cm-searchMatch { background-color: rgba(238, 255, 65, 0.4); border-radius: 2px; }
.cm-searchMatch-selected { background-color: #EEFF41; }

/* === iOS-specific adjustments === */
body {
  /* Safe area insets for notch/home indicator */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
</style>
</head>
<body>
<div id="editor"></div>

<script type="importmap">
{
  "imports": {
    "@codemirror/state": "https://esm.sh/@codemirror/state@6.5.4",
    "@codemirror/view": "https://esm.sh/@codemirror/view@6.39.11",
    "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.10.1",
    "@codemirror/lang-markdown": "https://esm.sh/@codemirror/lang-markdown@6.5.0",
    "@codemirror/language": "https://esm.sh/@codemirror/language@6.12.1",
    "@codemirror/search": "https://esm.sh/@codemirror/search@6.6.0"
  }
}
</script>

<script type="module">
import { EditorState, RangeSetBuilder } from '@codemirror/state'
import { EditorView, keymap, highlightActiveLine, ViewPlugin, Decoration, drawSelection, WidgetType, scrollPastEnd } from '@codemirror/view'
import { defaultKeymap, history, historyKeymap, indentMore, indentLess } from '@codemirror/commands'
import { markdown } from '@codemirror/lang-markdown'
import { search, searchKeymap, getSearchQuery } from '@codemirror/search'

// === Decorations (ported from Editor.tsx) ===
const selectionMark = Decoration.mark({ class: 'selection-highlight' })
const firstLineMark = Decoration.mark({ class: 'first-line-title' })
const checkboxUnchecked = Decoration.mark({ class: 'checkbox-marker checkbox-unchecked' })
const checkboxChecked = Decoration.mark({ class: 'checkbox-marker checkbox-checked' })
const headingMarker = Decoration.mark({ class: 'heading-marker' })
const heading1 = Decoration.mark({ class: 'heading heading-1' })
const heading2 = Decoration.mark({ class: 'heading heading-2' })
const heading3 = Decoration.mark({ class: 'heading heading-3' })
const blockquoteMarker = Decoration.mark({ class: 'blockquote-marker' })
const blockquoteText = Decoration.mark({ class: 'blockquote-text' })
const boldText = Decoration.mark({ class: 'bold-text' })
const italicText = Decoration.mark({ class: 'italic-text' })
const linkBracket = Decoration.mark({ class: 'link-bracket' })
const linkText = Decoration.mark({ class: 'link-text' })
const linkUrlFull = Decoration.mark({ class: 'link-url' })
const bareUrlMark = Decoration.mark({ class: 'bare-url' })

// === Heading highlighter ===
const headingHighlighter = ViewPlugin.fromClass(class {
  constructor(view) { this.decorations = this.build(view) }
  update(update) { if (update.docChanged || update.viewportChanged) this.decorations = this.build(update.view) }
  build(view) {
    const b = new RangeSetBuilder()
    const doc = view.state.doc
    for (let i = 1; i <= doc.lines; i++) {
      const line = doc.line(i)
      const m = line.text.match(/^(#{1,3})\s+(.*)$/)
      if (m) {
        b.add(line.from, line.from + m[1].length, headingMarker)
        if (m[2].length > 0) {
          const d = m[1].length === 1 ? heading1 : m[1].length === 2 ? heading2 : heading3
          b.add(line.from + m[1].length + 1, line.to, d)
        }
      }
    }
    return b.finish()
  }
}, { decorations: v => v.decorations })

// === Blockquote highlighter ===
const blockquoteHighlighter = ViewPlugin.fromClass(class {
  constructor(view) { this.decorations = this.build(view) }
  update(update) { if (update.docChanged || update.viewportChanged) this.decorations = this.build(update.view) }
  build(view) {
    const b = new RangeSetBuilder()
    const doc = view.state.doc
    for (let i = 1; i <= doc.lines; i++) {
      const line = doc.line(i)
      const m = line.text.match(/^(>+)\s?(.*)$/)
      if (m) {
        b.add(line.from, line.from + m[1].length, blockquoteMarker)
        if (m[2].length > 0) {
          const ts = m[1].length + (line.text[m[1].length] === ' ' ? 1 : 0)
          b.add(line.from + ts, line.to, blockquoteText)
        }
      }
    }
    return b.finish()
  }
}, { decorations: v => v.decorations })

// === Emphasis highlighter ===
const emphasisHighlighter = ViewPlugin.fromClass(class {
  constructor(view) { this.decorations = this.build(view) }
  update(update) { if (update.docChanged || update.viewportChanged) this.decorations = this.build(update.view) }
  build(view) {
    const decos = []
    const doc = view.state.doc
    for (let i = 1; i <= doc.lines; i++) {
      const line = doc.line(i)
      const text = line.text
      let m
      const boldRe = /\*\*(.+?)\*\*/g
      while ((m = boldRe.exec(text)) !== null) {
        decos.push({ from: line.from + m.index + 2, to: line.from + m.index + 2 + m[1].length, deco: boldText })
      }
      const italicRe = /(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g
      while ((m = italicRe.exec(text)) !== null) {
        decos.push({ from: line.from + m.index + 1, to: line.from + m.index + 1 + m[1].length, deco: italicText })
      }
    }
    decos.sort((a, b) => a.from - b.from || a.to - b.to)
    const b = new RangeSetBuilder()
    for (const { from, to, deco } of decos) b.add(from, to, deco)
    return b.finish()
  }
}, { decorations: v => v.decorations })

// === Bullet indent ===
class BulletSpacerWidget extends WidgetType {
  constructor(offset) { super(); this.offset = offset }
  toDOM() {
    const s = document.createElement('span')
    s.style.marginLeft = `-${this.offset}px`
    s.style.display = 'inline-block'
    s.style.width = '0'
    return s
  }
  eq(other) { return this.offset === other.offset }
}

const indentHighlighter = ViewPlugin.fromClass(class {
  constructor(view) { this.charWidth = view.defaultCharacterWidth; this.decorations = this.build(view) }
  update(update) {
    const cw = update.view.defaultCharacterWidth
    if (update.docChanged || update.viewportChanged || this.charWidth !== cw) {
      this.charWidth = cw
      this.decorations = this.build(update.view)
    }
  }
  build(view) {
    const b = new RangeSetBuilder()
    const doc = view.state.doc
    const cw = view.defaultCharacterWidth
    for (let i = 1; i <= doc.lines; i++) {
      const line = doc.line(i)
      const text = line.text
      const cbm = text.match(/^(\s*)- \[[x ]\] /)
      if (cbm) {
        const off = (6 + cbm[1].length) * cw
        b.add(line.from, line.from, Decoration.line({ attributes: { style: `margin-left: ${off}px;` } }))
        b.add(line.from, line.from, Decoration.widget({ widget: new BulletSpacerWidget(off), side: -1 }))
        continue
      }
      const bm = text.match(/^(\s*)[*-] /)
      if (bm) {
        const off = (2 + bm[1].length) * cw
        b.add(line.from, line.from, Decoration.line({ attributes: { style: `margin-left: ${off}px;` } }))
        b.add(line.from, line.from, Decoration.widget({ widget: new BulletSpacerWidget(off), side: -1 }))
      }
    }
    return b.finish()
  }
}, { decorations: v => v.decorations })

// === Checkbox highlighter ===
const checkboxHighlighter = ViewPlugin.fromClass(class {
  constructor(view) { this.decorations = this.build(view) }
  update(update) { if (update.docChanged || update.viewportChanged) this.decorations = this.build(update.view) }
  build(view) {
    const b = new RangeSetBuilder()
    const doc = view.state.doc
    for (let i = 1; i <= doc.lines; i++) {
      const line = doc.line(i)
      if (line.text.match(/^- \[ \]/)) b.add(line.from + 2, line.from + 5, checkboxUnchecked)
      else if (line.text.match(/^- \[x\]/)) b.add(line.from + 2, line.from + 5, checkboxChecked)
    }
    return b.finish()
  }
}, { decorations: v => v.decorations })

// === First line title ===
const firstLineHighlighter = ViewPlugin.fromClass(class {
  constructor(view) { this.decorations = this.build(view) }
  update(update) { if (update.docChanged || update.viewportChanged) this.decorations = this.build(update.view) }
  build(view) {
    const b = new RangeSetBuilder()
    const fl = view.state.doc.line(1)
    if (fl.length > 0) b.add(fl.from, fl.to, firstLineMark)
    return b.finish()
  }
}, { decorations: v => v.decorations })

// === Cursor title tracker ===
const cursorTitleTracker = ViewPlugin.fromClass(class {
  constructor(view) {
    const line = view.state.doc.lineAt(view.state.selection.main.head)
    view.dom.classList.toggle('cursor-in-title', line.number === 1)
  }
  update(update) {
    const view = update.view
    const line = view.state.doc.lineAt(view.state.selection.main.head)
    view.dom.classList.toggle('cursor-in-title', line.number === 1)
  }
})

// === Selection highlighter ===
const selectionHighlighter = ViewPlugin.fromClass(class {
  constructor(view) { this.decorations = this.build(view) }
  update(update) { if (update.selectionSet || update.docChanged || update.viewportChanged) this.decorations = this.build(update.view) }
  build(view) {
    const b = new RangeSetBuilder()
    const { from, to } = view.state.selection.main
    if (from === to) return b.finish()
    const doc = view.state.doc
    let pos = from
    while (pos < to) {
      const line = doc.lineAt(pos)
      const le = Math.min(line.to, to)
      const ls = Math.max(line.from, pos)
      if (ls < le) b.add(ls, le, selectionMark)
      pos = line.to + 1
    }
    return b.finish()
  }
}, { decorations: v => v.decorations })

// === Link styler ===
function truncateUrl(url) {
  try { return new URL(url).origin + '/…' } catch { return url.slice(0, 30) + '…' }
}

class TruncatedUrlWidget extends WidgetType {
  constructor(fullUrl, displayText) { super(); this.fullUrl = fullUrl; this.displayText = displayText }
  toDOM() {
    const s = document.createElement('span')
    s.className = 'link-url-truncated'
    s.textContent = this.displayText
    s.setAttribute('data-full-url', this.fullUrl)
    return s
  }
  eq(other) { return other.fullUrl === this.fullUrl && other.displayText === this.displayText }
}

const linkStyler = ViewPlugin.fromClass(class {
  constructor(view) { this.decorations = this.build(view) }
  update(update) { if (update.docChanged || update.viewportChanged || update.selectionSet) this.decorations = this.build(update.view) }
  build(view) {
    const b = new RangeSetBuilder()
    const doc = view.state.doc
    const cl = doc.lineAt(view.state.selection.main.head).number
    for (let i = 1; i <= doc.lines; i++) {
      const line = doc.line(i)
      const text = line.text
      const isCL = i === cl
      const mdRe = /\[([^\]]+)\]\(([^)]+)\)/g
      let m
      while ((m = mdRe.exec(text)) !== null) {
        const s = line.from + m.index
        b.add(s, s + 1, linkBracket)
        b.add(s + 1, s + 1 + m[1].length, linkText)
        b.add(s + 1 + m[1].length, s + 2 + m[1].length, linkBracket)
        if (isCL) b.add(s + 2 + m[1].length, s + 2 + m[1].length + 2 + m[2].length, linkUrlFull)
      }
      const bareRe = /https?:\/\/[^\s\])<>]+/g
      while ((m = bareRe.exec(text)) !== null) {
        if (text.slice(0, m.index).match(/\]\($/)) continue
        if (isCL || m[0].length <= 60) b.add(line.from + m.index, line.from + m.index + m[0].length, bareUrlMark)
      }
    }
    return b.finish()
  }
}, { decorations: v => v.decorations })

const linkTruncator = ViewPlugin.fromClass(class {
  constructor(view) { this.decorations = this.build(view) }
  update(update) { if (update.docChanged || update.viewportChanged || update.selectionSet) this.decorations = this.build(update.view) }
  build(view) {
    const b = new RangeSetBuilder()
    const doc = view.state.doc
    const cl = doc.lineAt(view.state.selection.main.head).number
    for (let i = 1; i <= doc.lines; i++) {
      const line = doc.line(i)
      if (i === cl) continue
      const text = line.text
      const mdRe = /\[([^\]]+)\]\(([^)]+)\)/g
      let m
      while ((m = mdRe.exec(text)) !== null) {
        const s = line.from + m.index
        const us = s + 2 + m[1].length
        const ue = us + 2 + m[2].length
        b.add(us, ue, Decoration.replace({ widget: new TruncatedUrlWidget(m[2], '(…)') }))
      }
      const bareRe = /https?:\/\/[^\s\])<>]+/g
      while ((m = bareRe.exec(text)) !== null) {
        if (m[0].length <= 60) continue
        if (text.slice(0, m.index).match(/\]\($/)) continue
        const s = line.from + m.index
        b.add(s, s + m[0].length, Decoration.replace({ widget: new TruncatedUrlWidget(m[0], truncateUrl(m[0])) }))
      }
    }
    return b.finish()
  }
}, { decorations: v => v.decorations })

// === Search match counter ===
const searchMatchCounter = ViewPlugin.fromClass(class {
  constructor(view) { this.countEl = null; this.wrapper = null; this.doneBtn = null; this.lastQuery = ''; this.lastTotal = 0; this.setupPanel(view) }
  update(update) { this.setupPanel(update.view) }
  setupPanel(view) {
    const panel = view.dom.querySelector('.cm-search')
    if (!panel) { this.countEl = null; this.wrapper = null; this.doneBtn = null; return }
    const input = panel.querySelector('input[main-field]')
    if (input && !this.wrapper) {
      this.wrapper = document.createElement('div')
      this.wrapper.className = 'search-input-wrapper'
      input.parentNode?.insertBefore(this.wrapper, input)
      this.wrapper.appendChild(input)
      this.countEl = document.createElement('span')
      this.countEl.className = 'search-match-count'
      this.wrapper.appendChild(this.countEl)
      input.focus()
    }
    if (!this.doneBtn || !panel.contains(this.doneBtn)) {
      this.doneBtn = document.createElement('button')
      this.doneBtn.className = 'search-done-btn'
      this.doneBtn.textContent = 'Done'
      this.doneBtn.type = 'button'
      this.doneBtn.onclick = () => panel.querySelector('[name="close"]')?.click()
      panel.appendChild(this.doneBtn)
    }
    this.updateCount(view)
  }
  updateCount(view) {
    if (!this.countEl) return
    const query = getSearchQuery(view.state)
    if (!query.valid) { this.countEl.textContent = ''; return }
    const doc = view.state.doc
    const cursor = query.getCursor(doc)
    let total = 0, current = 0, firstFrom = -1
    const sel = view.state.selection.main
    let r = cursor.next()
    while (!r.done) {
      total++
      if (firstFrom === -1) firstFrom = r.value.from
      if (r.value.from <= sel.from && r.value.to >= sel.from) current = total
      r = cursor.next()
    }
    this.countEl.textContent = total === 0 ? '0' : current > 0 ? `${current}/${total}` : String(total)
  }
})

// === Build the editor ===
const theme = EditorView.theme({
  '&': { height: '100%', fontSize: '17px' },
  '.cm-content': {
    fontFamily: '"SF Mono", Menlo, Monaco, "Courier New", monospace',
    paddingTop: '12px',
    paddingBottom: '20px',
    lineHeight: '1.6',
  },
  '.cm-line': { paddingLeft: '0', paddingRight: '0' },
  '.cm-gutters': { display: 'none' },
  '.cm-activeLineGutter': { backgroundColor: 'transparent' },
  '.cm-activeLine': { backgroundColor: 'transparent' },
  '.cm-scroller': {
    overflow: 'auto',
    paddingLeft: '20px',
    paddingRight: '20px',
  },
  '&.cm-focused': { outline: 'none' },
})

const lightTheme = EditorView.theme({
  '&': { backgroundColor: 'var(--bg)', color: 'var(--fg)' },
}, { dark: false })

let editorView

const appKeymap = keymap.of([
  {
    key: 'Mod-Shift-8',
    run: (view) => {
      const { from, to, head } = view.state.selection.main
      const startLine = view.state.doc.lineAt(from)
      const endLine = view.state.doc.lineAt(to)
      const cursorLine = view.state.doc.lineAt(head)
      const changes = []
      let adding = false
      for (let i = startLine.number; i <= endLine.number; i++) {
        const line = view.state.doc.line(i)
        if (line.text.startsWith('* ')) {
          changes.push({ from: line.from, to: line.from + 2, insert: '' })
        } else {
          changes.push({ from: line.from, to: line.from, insert: '* ' })
          if (i === cursorLine.number) adding = true
        }
      }
      view.dispatch({ changes, selection: { anchor: adding ? head + 2 : Math.max(cursorLine.from, head - 2) } })
      return true
    },
  },
  {
    key: 'Mod-Shift-l',
    run: (view) => {
      const { from, to, head } = view.state.selection.main
      const startLine = view.state.doc.lineAt(from)
      const endLine = view.state.doc.lineAt(to)
      const cursorLine = view.state.doc.lineAt(head)
      const changes = []
      let delta = 0
      for (let i = startLine.number; i <= endLine.number; i++) {
        const line = view.state.doc.line(i)
        if (line.text.match(/^- \[[x ]\] /)) {
          changes.push({ from: line.from, to: line.from + 6, insert: '' })
          if (i === cursorLine.number) delta = -6
        } else if (line.text.match(/^- \[[x ]\]/)) {
          changes.push({ from: line.from, to: line.from + 5, insert: '' })
          if (i === cursorLine.number) delta = -5
        } else {
          changes.push({ from: line.from, to: line.from, insert: '- [ ] ' })
          if (i === cursorLine.number) delta = 6
        }
      }
      view.dispatch({ changes, selection: { anchor: Math.max(cursorLine.from, head + delta) } })
      return true
    },
  },
  {
    key: 'Mod-Enter',
    run: (view) => {
      const { head } = view.state.selection.main
      const line = view.state.doc.lineAt(head)
      const text = line.text
      const uc = text.indexOf('- [ ]')
      const ch = text.indexOf('- [x]')
      if (uc !== -1) {
        view.dispatch({ changes: { from: line.from + uc + 3, to: line.from + uc + 4, insert: 'x' } })
        return true
      } else if (ch !== -1) {
        view.dispatch({ changes: { from: line.from + ch + 3, to: line.from + ch + 4, insert: ' ' } })
        return true
      }
      return false
    },
  },
  { key: 'Tab', run: indentMore },
  { key: 'Shift-Tab', run: indentLess },
])

const updateListener = EditorView.updateListener.of((update) => {
  if (update.docChanged) {
    const content = update.state.doc.toString()
    window.webkit?.messageHandlers?.contentChanged?.postMessage(content)
  }
})

const state = EditorState.create({
  doc: '',
  extensions: [
    theme,
    lightTheme,
    highlightActiveLine(),
    history(),
    appKeymap,
    keymap.of([...defaultKeymap, ...historyKeymap, ...searchKeymap]),
    search({ top: true }),
    searchMatchCounter,
    markdown(),
    updateListener,
    EditorView.lineWrapping,
    scrollPastEnd(),
    EditorView.scrollMargins.of(() => ({ bottom: 50 })),
    selectionHighlighter,
    firstLineHighlighter,
    checkboxHighlighter,
    headingHighlighter,
    blockquoteHighlighter,
    emphasisHighlighter,
    indentHighlighter,
    linkStyler,
    linkTruncator,
    EditorView.domEventHandlers({
      click: (event, view) => {
        const target = event.target
        // Handle checkbox clicks
        if (target.classList.contains('checkbox-marker')) {
          event.preventDefault()
          const pos = view.posAtDOM(target)
          const line = view.state.doc.lineAt(pos)
          const text = line.text
          const uc = text.indexOf('- [ ]')
          const ch = text.indexOf('- [x]')
          if (uc !== -1) view.dispatch({ changes: { from: line.from + uc + 3, to: line.from + uc + 4, insert: 'x' } })
          else if (ch !== -1) view.dispatch({ changes: { from: line.from + ch + 3, to: line.from + ch + 4, insert: ' ' } })
          return true
        }
        // Handle link taps (iOS: single tap on links opens them)
        if (target.classList.contains('link-url-truncated')) {
          const url = target.getAttribute('data-full-url')
          if (url) window.webkit?.messageHandlers?.openUrl?.postMessage(url)
          return true
        }
        return false
      },
    }),
    cursorTitleTracker,
    drawSelection({ cursorBlinkRate: 0 }),
  ],
})

editorView = new EditorView({ state, parent: document.getElementById('editor') })
editorView.focus()

// === Global functions for Swift bridge ===
window.setContent = function(content) {
  if (editorView && editorView.state.doc.toString() !== content) {
    editorView.dispatch({
      changes: { from: 0, to: editorView.state.doc.length, insert: content },
      selection: { anchor: content.length },
    })
  }
}

window.setTheme = function(theme) {
  document.documentElement.setAttribute('data-theme', theme)
}

window.focusEditor = function() {
  editorView?.focus()
}

window.getContent = function() {
  return editorView?.state.doc.toString() ?? ''
}

// Notify Swift that editor is ready
window.webkit?.messageHandlers?.editorReady?.postMessage(true)
</script>
</body>
</html>
